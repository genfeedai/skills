name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

# Least-privilege default token; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate skills
        run: bun run validate

      - name: Test worker scripts
        run: bun test ./loop/social-poster

      - name: Checkout MCP reference checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: genfeedai/genfeed.ai
          ref: master
          path: .mcp-reference-checker
          persist-credentials: false

      - name: Record checker source revision
        run: |
          checker_sha="$(git -C .mcp-reference-checker rev-parse HEAD)"
          echo "MCP reference checker source: ${checker_sha}" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate public MCP tool references
        run: |
          bun run "$GITHUB_WORKSPACE/.mcp-reference-checker/scripts/architecture/check-mcp-tool-references.ts" \
            --skills-dir "$GITHUB_WORKSPACE" --no-local-skills --no-desktop
